name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Derive version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version_name="${TAG_NAME#v}"
          IFS='.' read -r major minor patch <<< "$version_name"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Rename APK for release
        run: cp app/build/outputs/apk/release/app-release.apk PulseFin.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Query the tag object via the API rather than the local checkout — actions/checkout
          # can materialize a pushed annotated tag as a lightweight ref pointing at its commit,
          # which silently loses the annotation message (confirmed on the v0.1.0 release).
          tag_object_type="$(gh api "repos/$REPO/git/refs/tags/$TAG_NAME" --jq '.object.type')"
          if [ "$tag_object_type" = "tag" ]; then
            tag_sha="$(gh api "repos/$REPO/git/refs/tags/$TAG_NAME" --jq '.object.sha')"
            notes="$(gh api "repos/$REPO/git/tags/$tag_sha" --jq '.message')"
          else
            notes="Release $TAG_NAME"
          fi
          gh release create "$TAG_NAME" PulseFin.apk \
            --title "$TAG_NAME" \
            --notes "$notes"

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

APP_VERSION_NAME=0.2.1
APP_VERSION_CODE=2001

# --- Build performance ---
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
org.gradle.parallel=true
# Build-output caching disabled: Gradle 9.5.1 fails to pack the large merged-dex output
# into the local cache ("Could not pack tree 'outputDir'"). Incremental up-to-date checks
# still apply, so rebuilds stay fast without it.
org.gradle.caching=false
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true

# --- AGP 9.x behavior (aligns the module build scripts with the PixelPlay-proven config) ---
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.builtInKotlin=true
android.newDsl=true
ksp.useKSP2=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
